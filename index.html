<html lang="ja">
<head>

  <title>毎朝の主要ニュースまとめ</title>
  <meta name="description" content="毎朝5:30に自動更新される自分専用のAIニュースまとめアプリ" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="毎朝の主要ニュースまとめ" />

  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --bg-outer: #e2e8f0;
      --bg-app: #f8fafc;
      --bg-header: rgba(255, 255, 255, 0.94);
      --bg-card: #ffffff;
      --bg-card-hover: #f1f5f9;
      --bg-summary: #f1f5f9;
      --text-main: #0f172a;
      --text-sub: #475569;
      --text-muted: #64748b;
      --accent: #2563eb;
      --accent-blue: #1d4ed8;
      --accent-gold: #f59e0b;
      --accent-emerald: #059669;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-outer);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      line-height: 1.55;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    /* PCで開いた時もスマホの縦長アプリサイズ感で綺麗に見えるコンテナ */
    .app-shell {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background-color: var(--bg-app);
      box-shadow: 0 0 36px rgba(15, 23, 42, 0.12);
      display: flex;
      flex-direction: column;
      position: relative;
      padding-bottom: 84px;
    }

    /* ヘッダー */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--bg-header);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px 8px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.2);
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 1.12rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      margin: 0;
      background: linear-gradient(95deg, #0f172a 0%, #2563eb 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .update-meta {
      font-size: 0.72rem;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--accent-emerald);
      box-shadow: 0 0 6px rgba(5, 150, 105, 0.5);
      display: inline-block;
    }

    /* 検索・ステータスバー */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }

    .search-box {
      flex: 1;
      position: relative;
    }

    .search-input {
      width: 100%;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      color: var(--text-main);
      padding: 7px 12px 7px 30px;
      font-size: 0.82rem;
      outline: none;
    }

    .search-input:focus {
      background: #ffffff;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.8rem;
      color: var(--text-muted);
      pointer-events: none;
    }

    .action-chip {
      background: #eff6ff;
      color: var(--accent);
      border: 1px solid #bfdbfe;
      border-radius: 10px;
      padding: 7px 10px;
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .action-chip:active {
      transform: scale(0.96);
    }

    /* 横スクロールタブバー */
    .tabs-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 10px 0 4px;
      margin: 0 -4px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .tabs-bar::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: var(--text-sub);
      font-size: 0.78rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.18s ease;
      flex-shrink: 0;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #2563eb 0%, #0284c7 100%);
      color: #ffffff;
      border-color: #2563eb;
      box-shadow: 0 3px 10px rgba(37, 99, 235, 0.25);
    }

    .tab-badge {
      background: #f1f5f9;
      color: var(--text-sub);
      font-size: 0.68rem;
      padding: 1px 6px;
      border-radius: 999px;
      font-weight: 700;
    }

    .tab-btn.active .tab-badge {
      background: rgba(255, 255, 255, 0.25);
      color: #ffffff;
    }

    /* 記事リスト */
    .feed-container {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .section-banner {
      background: linear-gradient(135deg, #fffbeb, #eff6ff);
      border: 1px solid #fde68a;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 0.78rem;
      color: #b45309;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* ニュースカード */
    .news-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 14px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
      transition: transform 0.16s ease, opacity 0.2s ease, border-color 0.16s ease;
      position: relative;
      overflow: hidden;
    }

    .news-card.top-pick {
      border-color: #fcd34d;
      box-shadow: 0 3px 12px rgba(245, 158, 11, 0.08);
    }

    .news-card.is-read {
      opacity: 0.68;
      background: #f8fafc;
    }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .meta-left {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .cat-tag {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
    }

    .source-name {
      font-size: 0.73rem;
      color: var(--text-sub);
      font-weight: 600;
    }

    .rank-badge {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #ffffff;
      font-size: 0.68rem;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 6px;
    }

    .stars-box {
      font-size: 0.76rem;
      color: var(--accent-gold);
      letter-spacing: 1px;
      font-weight: 700;
    }

    .card-title {
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--text-main);
      margin: 0 0 6px;
      line-height: 1.42;
    }

    .card-title a {
      color: inherit;
      text-decoration: none;
    }

    .orig-title {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin: 0 0 9px;
      line-height: 1.35;
    }

    .pick-reason {
      font-size: 0.74rem;
      color: #b45309;
      background: #fffbeb;
      border-left: 3px solid var(--accent-gold);
      padding: 5px 8px;
      border-radius: 0 6px 6px 0;
      margin-bottom: 9px;
      font-weight: 600;
    }

    .summary-box {
      background: var(--bg-summary);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 11px;
      border: 1px solid #e2e8f0;
    }

    .summary-label {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .summary-list {
      margin: 0;
      padding-left: 16px;
      font-size: 0.83rem;
      color: #334155;
    }

    .summary-list li {
      margin-bottom: 4px;
    }

    .summary-list li:last-child {
      margin-bottom: 0;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 4px;
    }

    .pub-time {
      font-size: 0.71rem;
      color: var(--text-muted);
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-read-toggle {
      background: #f1f5f9;
      color: var(--text-sub);
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-read-toggle.unread-state {
      background: #ecfdf5;
      color: #047857;
      border-color: #a7f3d0;
    }

    .btn-open-article {
      background: #2563eb;
      color: #ffffff;
      border: 1px solid #1d4ed8;
      border-radius: 8px;
      padding: 6px 11px;
      font-size: 0.75rem;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 2px 5px rgba(37, 99, 235, 0.2);
    }

    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-sub);
      background: #ffffff;
      border-radius: 16px;
      border: 1px dashed #cbd5e1;
    }

    .empty-icon {
      font-size: 2.2rem;
      margin-bottom: 8px;
    }

    /* 下部ナビバー (スマホ片手操作用) */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 480px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid var(--border);
      box-shadow: 0 -2px 10px rgba(15, 23, 42, 0.04);
      display: flex;
      justify-content: space-around;
      padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
      z-index: 40;
    }

    .nav-item {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.68rem;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 4px 10px;
      cursor: pointer;
    }

    .nav-item.active {
      color: var(--accent);
    }

    .nav-icon {
      font-size: 1.1rem;
    }
  </style>
</head>

                <span class="cat-tag">${catMeta.icon} ${escapeHtml(catMeta.label)}</span>
                <span class="source-name">${escapeHtml(art.source_name)}</span>
              </div>
              <span class="stars-box" title="AI注目度 星${art.stars}">${formatStars(art.stars)}</span>
            </div>

            <h2 class="card-title">
              <a href="${escapeHtml(art.url)}" target="_blank" rel="noopener noreferrer" data-open-id="${escapeHtml(art.id)}">
                ${escapeHtml(art.title_ja)}
              </a>
            </h2>

            ${showOrig ? `<p class="orig-title">原文: ${escapeHtml(art.original_title)}</p>` : ''}

            ${art.pick_reason ? `<div class="pick-reason">💡 ${escapeHtml(art.pick_reason)}</div>` : ''}

            <div class="summary-box">
              <div class="summary-label">✨ AI 3行要約</div>
              <ul class="summary-list">
                ${pointsHtml}
              </ul>
            </div>

            <div class="card-footer">
              <span class="pub-time">🕒 ${escapeHtml(art.published_at)}</span>
              <div class="card-actions">
                <button class="btn-read-toggle ${!isRead ? 'unread-state' : ''}" data-toggle-id="${escapeHtml(art.id)}">
                  ${isRead ? '↩ 未読に戻す' : '✓ 既読にする'}
                </button>
                <a href="${escapeHtml(art.url)}" target="_blank" rel="noopener noreferrer" class="btn-open-article" data-open-id="${escapeHtml(art.id)}">
                  記事を読む ↗
                </a>
              </div>
            </div>
          </article>
        `;
      }).join("");

      container.innerHTML = bannerHtml + cardsHtml;
      bindCardEvents();
      bindBannerEvents();
    }

    function bindBannerEvents() {
      const resetBtn = document.getElementById("resetReadBtn");
      if (resetBtn) {
        resetBtn.addEventListener("click", () => {
          readSet.clear();
          saveReadState();
          renderAll();
        });
      }
    }

    function bindCardEvents() {
      document.querySelectorAll("[data-toggle-id]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-toggle-id");
          if (readSet.has(id)) {
            readSet.delete(id);
          } else {
            readSet.add(id);
          }
          saveReadState();
          renderAll();
        });
      });

      document.querySelectorAll("[data-open-id]").forEach(link => {
        link.addEventListener("click", () => {
          const id = link.getAttribute("data-open-id");
          if (!readSet.has(id)) {
            readSet.add(id);
            saveReadState();
            setTimeout(renderAll, 250);
          }
        });
      });
    }

    function renderAll() {
      renderTabs();
      renderFeed();
    }

    document.getElementById("searchInput").addEventListener("input", e => {
      searchQuery = e.target.value || "";
      renderFeed();
    });

    document.getElementById("markAllBtn").addEventListener("click", () => {
      const visible = filterArticles();
      visible.forEach(a => readSet.add(a.id));
      saveReadState();
      renderAll();
    });

    document.querySelectorAll(".bottom-nav .nav-item").forEach(btn => {
      btn.addEventListener("click", () => {
        activeTab = btn.getAttribute("data-tab");
        syncBottomNav();
        renderAll();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    });

    renderAll();
  </script>
</body>
</html>
